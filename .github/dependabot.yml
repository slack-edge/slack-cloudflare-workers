version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directory: "/examples/simple-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      simple-app-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/examples/oauth-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      oauth-app-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
